name: 📊 Generate Weekly Report

# ── يشتغل لما تضغط "Run workflow" من صفحة Actions ────────────────────────────
on:
  workflow_dispatch:

jobs:
  generate-pdf:
    name: Generate PDF Report
    runs-on: ubuntu-latest
    timeout-minutes: 30   # الـ PDF بياخد 2-3 دقائق — 30 دقيقة أكتر من كفاية

    steps:
      # 1. تحميل الكود
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 3. تثبيت Chrome (مطلوب لـ Puppeteer)
      - name: 🌐 Install Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      # 4. تثبيت dependencies
      - name: 📦 Install dependencies
        run: npm ci

      # 5. تشغيل سكريبت الـ PDF
      - name: 📄 Generate Weekly Report PDF
        run: node scripts/generate-report.mjs
        env:
          # ── Secrets: حطّهم في GitHub → Settings → Secrets and variables → Actions
          SITE_EMAIL:    ${{ secrets.SITE_EMAIL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          # ── Variables: حطّهم في GitHub → Settings → Secrets and variables → Variables
          SITE_URL:      ${{ vars.SITE_URL }}
          BACKEND_URL:   ${{ vars.BACKEND_URL }}
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
          PUPPETEER_EXECUTABLE_PATH: '/usr/bin/google-chrome-stable'

      # 6. رفع الـ PDF كـ artifact — مدة الحفاظ عليه 7 أيام
      - name: 📤 Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Weekly-Report-${{ github.run_number }}
          path: Weekly_Routine_*.pdf
          retention-days: 7
